name: Production smoke

# 프로덕션 카나리 — CI 게이트가 아니다(머지를 막지 않는다).
# 배포된 ksways.co 가 실제로 렌더되는지만 본다: lang·h1·main·"Application error" 부재·콘솔 에러 0.
# 상태코드만 보는 헬스체크로는 200 + 빈 앱 화면(ASCA 2026-08-06 형태)을 못 잡는다.
#
# 실패 알림: GitHub Actions 기본 알림(워크플로 실패 메일/웹 알림)만 쓴다.
# Slack 등 외부 라우팅은 의도적으로 넣지 않았다 — 필요해지면 별도로 결정한다.
# ⚠️ schedule 은 저장소가 60일간 활동이 없으면 GitHub 이 자동 비활성화한다.

on:
  workflow_dispatch:
  schedule:
    # 6시간마다 (UTC)
    - cron: '0 */6 * * *'
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      # push 트리거일 때만: Vercel 배포가 전파될 시간을 준다(배포 자체는 ~30s).
      # 이 대기는 "방금 머지한 커밋"을 검증하려는 것이고, schedule/dispatch 는 곧바로 현재 배포본을 본다.
      - name: Wait for deployment to propagate
        if: github.event_name == 'push'
        run: sleep 120

      - run: npm run test:e2e:prod

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-artifacts
          path: test-results/
          retention-days: 7
