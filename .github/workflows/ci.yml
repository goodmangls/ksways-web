name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      # coverage thresholds(vitest.config.ts)가 회귀 floor 게이트로 동작한다
      - run: npm run test:coverage

  # linux 환경 next build — 필수 게이트 (실험 job 3연속 PASS 후 승격, 2026-07-12).
  # 로컬 macOS build 실패(/_global-error prerender)는 이 게이트와 무관한 darwin 한정 framework debt
  # (docs/archive/2026-07/node24-build-fix, ksways-ci-hardening 참조).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  # e2e — 필수 게이트 (2026-08-18 실험 잡 도입, 3연속 PASS 후 2026-08-19 승격):
  # Playwright 견적 플로우 + 8페이지 스모크. quality·build 와 같은 머지 차단 관례.
  # retries 0 은 승격 시점 결정값 — 실험 3회 무flake 였으므로 재시도 없이 시작,
  # 실제 flake 관측 시 재검토. needs: 체인 금지 — SKIPPED 부채 은폐 방지.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
